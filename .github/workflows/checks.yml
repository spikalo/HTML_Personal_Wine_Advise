name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - run: php tests/run.php
